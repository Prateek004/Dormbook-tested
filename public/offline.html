<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DormBook — No connection</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f5; color: #1f2a2e; }
  @media (prefers-color-scheme: dark) { body { background: #111418; color: #e5e7eb; } .card { background: #1b1f25 !important; } }
  .card { background: #fff; border-radius: 16px; padding: 32px 24px; margin: 16px; max-width: 360px; text-align: center;
          box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 12px 0 8px; }
  p { font-size: 15px; line-height: 1.5; opacity: .8; margin: 0 0 24px; }
  button { font: inherit; font-weight: 600; font-size: 16px; padding: 12px 28px; border: 0; border-radius: 10px;
           background: #0f766e; color: #fff; cursor: pointer; width: 100%; }
  .icon { font-size: 44px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>No internet connection</h1>
    <p>DormBook needs internet to load your PG data. Check your Wi-Fi or mobile data, then try again.</p>
    <button id="retry">Try again</button>
  </div>
<script>
  // Shown by the Android app (Capacitor server.errorPath) when the live
  // server cannot be reached. Retry goes back to the live app.
  var LIVE_URL = 'https://dormbook-tested-production.up.railway.app/';
  document.getElementById('retry').addEventListener('click', function () { window.location.href = LIVE_URL; });
  window.addEventListener('online', function () { window.location.href = LIVE_URL; });
</script>
</body>
</html>
